<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="بوابتك لإتقان المحاسبة"><title>الاختبارات | مِعيار MEYAR</title><link rel="stylesheet" href="style.css"></head><body><header><div class="wrap nav"><a class="brand" href="index.html">مِعيار <span>| MEYAR</span></a><nav><a href="index.html">الرئيسية</a><a href="basics.html">أساسيات المحاسبة</a><a href="dictionary.html">القاموس الإنجليزي</a><a href="quiz.html">الاختبارات</a><a href="simulation.html">محاكاة الشركات</a><a href="templates.html">النماذج</a><a href="interviews.html">مقابلات العمل</a></nav></div></header><section class="page-title"><div class="wrap"><div class="crumb"><a href="index.html">الرئيسية</a> ← الاختبارات</div><h1>اختبر معلوماتك المحاسبية</h1><p>اختبار تأسيسي من 5 أسئلة مع تصحيح فوري.</p></div></section><main class="wrap section"><div class="panel" style="max-width:760px;margin:auto"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><b id="num">السؤال 1 من 5</b><b id="score">النتيجة: 0</b></div><p class="muted" id="bestScore" aria-live="polite"></p><h2 id="q"></h2><div class="options" id="opts"></div><p id="feedback"></p><div class="pager"><button class="btn dark" onclick="resetQuiz()">إعادة الاختبار</button><button class="btn" id="next" onclick="nextQ()" disabled>التالي ←</button></div></div></main><script src="progress.js"></script><script>const qs=[['ما المعادلة المحاسبية الصحيحة؟',['الأصول = الخصوم + حقوق الملكية','الأصول = الإيرادات − المصروفات','الخصوم = الأصول + المصروفات'],0,'الأصول = الخصوم + حقوق الملكية.'],['أي الحسابات التالية أصل؟',['الموردون','الصندوق','رأس المال'],1,'الصندوق من الأصول.'],['عند زيادة المصروف يكون طرفه غالبًا:',['دائن','مدين','لا يسجل'],1,'المصروفات تزيد مدينة.'],['شراء بضاعة نقدًا يؤدي إلى:',['زيادة المخزون ونقص الصندوق','زيادة الموردين وزيادة الصندوق','نقص المخزون وزيادة الصندوق'],0,'المخزون يزيد والصندوق ينقص.'],['مجموع المدين في القيد يجب أن:',['يكون أكبر','يكون أقل','يساوي الدائن'],2,'القيد المتوازن يتساوى فيه المدين والدائن.']];let i=0,sc=0,done=false;function draw(){const best=MeyarProgress.getQuizScore();document.getElementById('bestScore').textContent=best?'أفضل نتيجة محفوظة: '+best.best+' من '+best.total:'لم تؤدِ الاختبار بعد — ستُحفظ أفضل نتيجة لك على هذا الجهاز.';document.getElementById('num').textContent=`السؤال ${i+1} من 5`;document.getElementById('score').textContent='النتيجة: '+sc;document.getElementById('q').textContent=qs[i][0];document.getElementById('feedback').textContent='';document.getElementById('next').disabled=true;document.getElementById('next').textContent=i===4?'عرض النتيجة':'التالي ←';done=false;document.getElementById('opts').innerHTML=qs[i][1].map((x,j)=>`<button class="option" onclick="answer(${j})">${x}</button>`).join('')}function answer(j){if(done)return;done=true;let b=[...document.querySelectorAll('.option')];b[qs[i][2]].classList.add('good');if(j===qs[i][2]){sc++;document.getElementById('feedback').textContent='إجابة صحيحة! '+qs[i][3]}else{b[j].classList.add('bad');document.getElementById('feedback').textContent='ليست صحيحة. '+qs[i][3]}document.getElementById('score').textContent='النتيجة: '+sc;document.getElementById('next').disabled=false}function nextQ(){if(!done)return;if(i<4){i++;draw()}else{MeyarProgress.saveQuizScore(sc,5);const best=MeyarProgress.getQuizScore();document.getElementById('bestScore').textContent='أفضل نتيجة محفوظة: '+best.best+' من '+best.total;document.getElementById('q').textContent=`انتهى الاختبار — نتيجتك ${sc} من 5`;document.getElementById('opts').innerHTML='';document.getElementById('feedback').textContent=sc>=4?'ممتاز!':'واصل التدريب وراجع الدروس.';document.getElementById('next').disabled=true}}function resetQuiz(){i=0;sc=0;draw()}draw();</script><footer><div class="wrap"><b>مِعيار | MEYAR</b><div>بوابتك لإتقان المحاسبة</div><small>منصة تعليمية عربية — نسخة تطويرية مجانية</small></div></footer></body></html>
